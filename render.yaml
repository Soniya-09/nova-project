databases:
  - name: nova-db
    plan: free

services:
  - type: web
    name: nova-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nova-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        # Render's fromService "host" property returns the internal
        # (private-network) hostname, not the public onrender.com URL —
        # not usable for CORS against a browser. Set this manually after
        # first deploy to the frontend's public URL, e.g.
        # https://nova-frontend-xxxx.onrender.com
        sync: false

  - type: web
    name: nova-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Same issue as CLIENT_URL above — set manually after first deploy
        # to the backend's public URL, e.g.
        # https://nova-backend-xxxx.onrender.com
        # (a static site rebuilds automatically when its env vars change,
        # since Vite bakes this in at build time)
        sync: false
